services:
  database:
    image: postgres:latest
    container_name: ordersStore
    ports:
      - "5430:5432"
    shm_size: 128mb
    environment:
      - "POSTGRES_DB=ordersStore"
      - "POSTGRES_USER=postgres"
      - "POSTGRES_PASSWORD=password"
    volumes:
      - ordersData:/var/lib/postgresql/data

volumes:
  ordersData:
